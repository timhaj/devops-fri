#cloud-config

package_update: true
package_upgrade: true

packages:
  - git
  - curl

write_files:
  - path: /root/devops-fri/.env
    permissions: '0600'
    owner: root:root
    defer: true
    content: |
      MNEMONIC="kiwi there energy noble panda reflect corn cargo echo gravity search embrace"
      SEPOLIA_RPC_URL="https://eth-sepolia.g.alchemy.com/v2/LkiAFeBAOtY2PCSUvSVKU"
      PRIVATE_KEY="6500f80b4ec4a8d70e992f8ad089e7d8f900b55d6152a03513a177a29e5d40f3"

  - path: /etc/systemd/system/backend-server.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Backend Node.js Server
      After=network.target
      
      [Service]
      Type=simple
      User=root
      WorkingDirectory=/root/devops-fri
      ExecStart=/usr/bin/node backend-server.js
      Restart=always
      RestartSec=10
      StandardOutput=journal
      StandardError=journal
      
      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/frontend-server.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Frontend HTTP Server
      After=network.target backend-server.service
      
      [Service]
      Type=simple
      User=root
      WorkingDirectory=/root/devops-fri/public
      ExecStart=/usr/bin/npx http-server -p 8080
      Restart=always
      RestartSec=10
      StandardOutput=journal
      StandardError=journal
      
      [Install]
      WantedBy=multi-user.target

runcmd:
  - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
  - apt-get install -y nodejs
  
  - node --version
  - npm --version
  
  - git clone -b deploy_test https://github.com/timhaj/devops-fri /root/devops-fri
  
  - cd /root/devops-fri && npm install express cors web3 body-parser dotenv http-server
  
  - systemctl daemon-reload
  - systemctl enable backend-server.service
  - systemctl enable frontend-server.service
  - systemctl start backend-server.service
  - systemctl start frontend-server.service

final_message: "Cloud-init deployment complete! Backend running, Frontend on port 8080. IMPORTANT: Update /root/devops-fri/.env with your actual API keys and restart services!"