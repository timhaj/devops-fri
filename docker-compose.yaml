version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: rps-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - rps-network
    restart: unless-stopped
    volumes:
      # Mount for development (optional - comment out for production)
      # - ./backend-server.js:/app/backend-server.js
      - backend-logs:/app/logs

  # Frontend Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: rps-frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - rps-network
    restart: unless-stopped

  # Redis Service (for future backend caching/session management)
  redis:
    image: redis:7-alpine
    container_name: rps-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    volumes:
      - redis-data:/data
      - redis-config:/usr/local/etc/redis
    networks:
      - rps-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  rps-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
  redis-config:
    driver: local
  backend-logs:
    driver: local