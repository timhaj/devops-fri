<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>RPS Simulation - DEV Version</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/web3@1.8.0/dist/web3.min.js"></script>
  <style>
    .canvas-wrap { position: relative; width: 800px; height: 800px; }
    .stacked-canvas {
      position: absolute;
      left: 0;
      top: 0;
      image-rendering: crisp-edges;
    }
  </style>
</head>
<body class="bg-[#f4f6fb] text-[#0b1220] min-h-screen flex items-start justify-center p-8">

  <div class="space-y-4">
    <div class="flex gap-6 items-start">
      <!-- Left panel: canvases -->
      <div class="canvas-wrap rounded-2xl shadow-lg overflow-hidden border border-slate-200 bg-gradient-to-b from-white to-[#eef2ff]">
        <canvas id="trailCanvas" width="800" height="800" class="stacked-canvas"></canvas>
        <canvas id="board" width="800" height="800" class="stacked-canvas"></canvas>
      </div>

      <!-- Right panel: controls -->
      <div class="w-80 space-y-4">
        <!-- Wallet & Betting Panel -->
        <div class="bg-white rounded-2xl p-4 shadow-md border border-slate-200">
          <h2 class="text-lg font-semibold mb-3">Place Your Bet</h2>
          
          <div id="walletStatus" class="mb-3 text-sm">
            <button id="connectBtn" class="w-full py-2 px-4 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
              Connect MetaMask
            </button>
            <div id="walletInfo" class="hidden">
              <div class="text-xs text-slate-500">Connected:</div>
              <div id="walletAddress" class="font-mono text-xs mb-2"></div>
              <div class="text-xs text-slate-500">Balance: <span id="walletBalance" class="font-semibold">0</span> ETH</div>
            </div>
          </div>

          <div id="bettingForm" class="hidden">
            <label class="block text-xs text-slate-500 mb-1">Bet Amount (ETH)</label>
            <input id="betAmount" type="number" step="0.01" min="0.01" value="0.1" 
              class="w-full mb-3 rounded-md border px-3 py-2">

            <label class="block text-xs text-slate-500 mb-2">Predict Winner</label>
            <div class="space-y-2 mb-3">
              <label class="flex items-center gap-2 p-2 border rounded-lg cursor-pointer hover:bg-slate-50">
                <input type="radio" name="prediction" value="0" checked>
                <span class="w-3 h-3 rounded-full bg-red-600"></span>
                <span>Rock</span>
              </label>
              <label class="flex items-center gap-2 p-2 border rounded-lg cursor-pointer hover:bg-slate-50">
                <input type="radio" name="prediction" value="1">
                <span class="w-3 h-3 rounded-full bg-green-600"></span>
                <span>Paper</span>
              </label>
              <label class="flex items-center gap-2 p-2 border rounded-lg cursor-pointer hover:bg-slate-50">
                <input type="radio" name="prediction" value="2">
                <span class="w-3 h-3 rounded-full bg-blue-600"></span>
                <span>Scissors</span>
              </label>
            </div>

            <button id="placeBetBtn" class="w-full py-3 bg-emerald-600 text-white rounded-lg font-semibold hover:bg-emerald-700">
              Place Bet & Start Game
            </button>
          </div>

          <div id="gameStatus" class="hidden mt-3 p-3 bg-blue-50 border border-blue-200 rounded-lg">
            <div class="text-sm font-semibold text-blue-900">Game in Progress...</div>
            <div class="text-xs text-blue-700 mt-1">Game ID: <span id="currentGameId"></span></div>
          </div>

          <div id="resolving" class="hidden mt-3 p-3 bg-yellow-50 border border-yellow-200 rounded-lg">
            <div class="text-sm font-semibold text-yellow-900">Resolving on blockchain...</div>
            <div class="text-xs text-yellow-700 mt-1">Please wait for confirmation</div>
          </div>

          <div id="gameResult" class="hidden mt-3 p-3 rounded-lg">
            <div id="resultText" class="font-semibold mb-2"></div>
            <div id="txLink" class="text-xs mb-3"></div>
            <button id="playAgainBtn" class="w-full py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
              Play Again
            </button>
          </div>
        </div>

        <!-- Simulation Settings -->
        <div class="bg-white rounded-2xl p-4 shadow-md border border-slate-200">
          <h2 class="text-lg font-semibold mb-3">Settings</h2>

          <div class="flex gap-2 mb-3">
            <button id="pauseBtn" class="flex-1 py-2 rounded-lg border bg-white text-sm hover:bg-slate-50" disabled>Pause</button>
            <button id="resetBtn" class="flex-1 py-2 rounded-lg border bg-white text-sm hover:bg-slate-50" disabled>Reset</button>
          </div>

          <label class="block text-xs text-slate-500 mb-1">Tick speed</label>
          <div class="flex items-center gap-2 mb-3">
            <input id="speed" type="range" min="1" max="6" value="3" class="flex-1">
            <span id="speedValue" class="text-sm font-medium w-8">3</span>
          </div>

          <label class="block text-xs text-slate-500 mb-1">Moves / decision</label>
          <input id="movesPerDecision" type="number" min="1" max="20" value="3" 
            class="w-full mb-3 rounded-md border px-2 py-1">

          <label class="block text-xs text-slate-500 mb-1">Entities per type</label>
          <input id="entityCount" type="number" min="5" max="50" value="20" 
            class="w-full mb-3 rounded-md border px-2 py-1">

          <div class="mb-2">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" id="randomSpawn" checked class="rounded">
              <span class="text-sm">Random spawn (vs corners)</span>
            </label>
          </div>
        </div>

        <!-- Stats -->
        <div class="bg-white rounded-2xl p-4 shadow-md border border-slate-200">
          <h2 class="text-lg font-semibold mb-3">Live Stats</h2>

          <div class="space-y-2">
            <div class="flex items-center gap-3">
              <span class="w-3 h-3 rounded-full bg-red-600"></span>
              <div class="flex-1 text-sm">Rock</div>
              <div id="count-rock" class="font-medium">0</div>
            </div>
            <div class="flex items-center gap-3">
              <span class="w-3 h-3 rounded-full bg-green-600"></span>
              <div class="flex-1 text-sm">Paper</div>
              <div id="count-paper" class="font-medium">0</div>
            </div>
            <div class="flex items-center gap-3">
              <span class="w-3 h-3 rounded-full bg-blue-600"></span>
              <div class="flex-1 text-sm">Scissors</div>
              <div id="count-scissors" class="font-medium">0</div>
            </div>
          </div>

          <div class="mt-3 pt-3 border-t text-xs text-slate-500">
            <div class="flex justify-between mb-1">
              <span>Game Time:</span>
              <span id="gameTime" class="font-medium">0:00</span>
            </div>
            <div class="flex justify-between">
              <span>Total Conversions:</span>
              <span id="conversions" class="font-medium">0</span>
            </div>
          </div>

          <div id="winner" class="mt-4 text-sm font-semibold text-emerald-600 text-center"></div>
        </div>
      </div>
    </div>
  </div>

<script>

    {

        }
      ],

      "outputs": [
        {

          "name": "player",
          "type": "address"
        },
        {
          "internalType": "uint256",
          "name": "betAmount",
          "type": "uint256"
        },
        {
          "internalType": "enum RPSBetting.Element",
          "name": "prediction",
          "type": "uint8"
        },
        {
          "internalType": "bool",
          "name": "active",
          "type": "bool"
        },
        {
          "internalType": "bool",
          "name": "resolved",
          "type": "bool"
        },
        {
          "internalType": "enum RPSBetting.Element",
          "name": "winner",
          "type": "uint8"
        }
      ],
      "stateMutability": "view",
      "type": "function",
      "constant": true
    }
  ]; // Update this

  // Canvas setup
  const board = document.getElementById('board');
  const ctx = board.getContext('2d');
  const trailCanvas = document.getElementById('trailCanvas');
  const tctx = trailCanvas.getContext('2d');

  const W = board.width = trailCanvas.width = 800;
  const H = board.height = trailCanvas.height = 800;

  const GROUPS = ['rock', 'paper', 'scissors'];
  const IMAGES = {
    rock: new Image(),
    paper: new Image(),
    scissors: new Image()
  };
  IMAGES.rock.src = 'rock.png';
  IMAGES.paper.src = 'paper.png';
  IMAGES.scissors.src = 'scissor.png';

  const TRAIL_COLORS = {
    rock: 'rgba(220,38,38,',
    paper: 'rgba(16,163,74,',
    scissors: 'rgba(37,99,235,'
  };

  // Secure random helpers
  function randFloat() {
    const arr = new Uint32Array(1);
    crypto.getRandomValues(arr);
    return arr[0] / (0xFFFFFFFF + 1);
  }
  function randInt(max) {
    return Math.floor(randFloat() * max);
  }

  // DOM elements
  const connectBtn = document.getElementById('connectBtn');
  const walletInfo = document.getElementById('walletInfo');
  const walletAddress = document.getElementById('walletAddress');
  const walletBalance = document.getElementById('walletBalance');
  const bettingForm = document.getElementById('bettingForm');
  const placeBetBtn = document.getElementById('placeBetBtn');
  const gameStatus = document.getElementById('gameStatus');
  const resolving = document.getElementById('resolving');
  const gameResult = document.getElementById('gameResult');
  const playAgainBtn = document.getElementById('playAgainBtn');
  const resetBtn = document.getElementById('resetBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const speedSlider = document.getElementById('speed');
  const speedValue = document.getElementById('speedValue');
  const movesPerDecisionInput = document.getElementById('movesPerDecision');
  const entityCountInput = document.getElementById('entityCount');
  const randomSpawnCheckbox = document.getElementById('randomSpawn');
  const countRockEl = document.getElementById('count-rock');
  const countPaperEl = document.getElementById('count-paper');
  const countScissorsEl = document.getElementById('count-scissors');
  const winnerEl = document.getElementById('winner');
  const gameTimeEl = document.getElementById('gameTime');
  const conversionsEl = document.getElementById('conversions');
  const resultText = document.getElementById('resultText');

  // Web3 setup
  let web3;
  let contract;
  let userAccount;
  let currentGameId;
  let currentPrediction;

  let entities = [];
  const SIZE = 32;
  let running = false;
  let animationFrame = null;
  let gameStartTime = null;
  let totalConversions = 0;
  let gameActive = false;

  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function stepSize() { return 1 + (parseInt(speedSlider.value,10)-1)*0.8; }
  function movesPerDecision() {
    const v = parseInt(movesPerDecisionInput.value,10);
    return (isNaN(v) || v < 1) ? 3 : v;
  }
  function entityCount() {
    const v = parseInt(entityCountInput.value,10);
    return (isNaN(v) || v < 5) ? 20 : Math.min(v, 50);
  }

  function collide(a,b){
    const dx = a.x - b.x, dy = a.y - b.y;
    const minD = (a.size/2 + b.size/2);
    return dx*dx + dy*dy <= minD*minD;
  }

  function rps(aType,bType){
    if (aType === bType) return null;
    if ((aType === 'rock' && bType === 'scissors') ||
        (aType === 'scissors' && bType === 'paper') ||
        (aType === 'paper' && bType === 'rock')) {
      return aType;
    } else return bType;
  }

  function initGame(){
    entities = [];
    winnerEl.textContent = '';
    gameResult.classList.add('hidden');
    totalConversions = 0;
    gameStartTime = Date.now();
    conversionsEl.textContent = '0';

    const count = entityCount();
    const useRandomSpawn = randomSpawnCheckbox.checked;

    if (useRandomSpawn) {
      // Random spawn - each entity spawns anywhere on the canvas
      for (let i=0;i<3;i++){
        const group = GROUPS[i];
        for (let k=0;k<count;k++){
          const x = SIZE/2 + randFloat() * (W - SIZE);
          const y = SIZE/2 + randFloat() * (H - SIZE);
          entities.push({
            x, y,
            size: SIZE,
            type: group,
            dir: randInt(4),
            movesLeft: randInt(movesPerDecision()) + 1
          });
        }
      }
    } else {
      // Corner spawn
      const corners = [
        {x: 60, y: 60},
        {x: W - 60, y: 60},
        {x: 60, y: H - 60}
      ];
      for (let i=0;i<3;i++){
        const group = GROUPS[i];
        const corner = corners[i];
        for (let k=0;k<count;k++){
          const offsetX = (randFloat()-0.5) * 100;
          const offsetY = (randFloat()-0.5) * 100;
          const x = clamp(corner.x + offsetX, SIZE/2, W - SIZE/2);
          const y = clamp(corner.y + offsetY, SIZE/2, H - SIZE/2);
          entities.push({
            x, y,
            size: SIZE,
            type: group,
            dir: randInt(4),
            movesLeft: randInt(movesPerDecision()) + 1
          });
        }
      }
    }

    tctx.clearRect(0,0,W,H);
    tctx.fillStyle = 'rgba(244,246,251,1)';
    tctx.fillRect(0,0,W,H);
    updateCounts();
  }

  function updateCounts(){
    const counts = {rock:0,paper:0,scissors:0};
    for (const e of entities) counts[e.type]++;
    countRockEl.textContent = counts.rock;
    countPaperEl.textContent = counts.paper;
    countScissorsEl.textContent = counts.scissors;
  }

  function updateGameTime() {
    if (gameStartTime && running) {
      const elapsed = Math.floor((Date.now() - gameStartTime) / 1000);
      const minutes = Math.floor(elapsed / 60);
      const seconds = elapsed % 60;
      gameTimeEl.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
    }
  }

  function checkForWinner(){
    const typesPresent = new Set(entities.map(e=>e.type));
    if (typesPresent.size === 1){
      running = false;
      const winnerType = entities[0].type;
      const winnerName = winnerType.toUpperCase();
      winnerEl.textContent = `${winnerName} WINS!`;
      
      if (gameActive && currentGameId !== undefined) {
        resolveGameViaBackend(winnerType);
      }
    }
  }

  function separate(a,b){
    const dx = a.x - b.x, dy = a.y - b.y;
    const d = Math.sqrt(dx*dx + dy*dy) || 0.0001;
    const overlap = (a.size/2 + b.size/2) - d;
    if (overlap > 0){
      const push = overlap/2;
      const nx = dx / d, ny = dy / d;
      a.x += nx * push;
      a.y += ny * push;
      b.x -= nx * push;
      b.y -= ny * push;
      a.x = clamp(a.x, a.size/2, W - a.size/2);
      a.y = clamp(a.y, a.size/2, H - a.size/2);
      b.x = clamp(b.x, b.size/2, W - b.size/2);
      b.y = clamp(b.y, b.size/2, H - b.size/2);
    }
  }

  function tick(){
    const s = stepSize();
    const mpd = movesPerDecision();

    for (const e of entities){
      if (!Number.isFinite(e.movesLeft) || e.movesLeft <= 0){
        e.dir = randInt(4);
        e.movesLeft = mpd;
      }
      switch(e.dir){
        case 0: e.y -= s; break;
        case 1: e.y += s; break;
        case 2: e.x -= s; break;
        case 3: e.x += s; break;
      }
      e.movesLeft--;

      const half = e.size/2;
      if (e.x < half){ e.x = half + 1; e.dir = 3; e.movesLeft = Math.min(e.movesLeft, mpd); }
      if (e.x > W-half){ e.x = W-half - 1; e.dir = 2; e.movesLeft = Math.min(e.movesLeft, mpd); }
      if (e.y < half){ e.y = half + 1; e.dir = 1; e.movesLeft = Math.min(e.movesLeft, mpd); }
      if (e.y > H-half){ e.y = H-half - 1; e.dir = 0; e.movesLeft = Math.min(e.movesLeft, mpd); }
    }

    for (let i=0;i<entities.length;i++){
      for (let j=i+1;j<entities.length;j++){
        const a = entities[i], b = entities[j];
        if (collide(a,b)){
          if (a.type !== b.type){
            const winner = rps(a.type, b.type);
            if (winner){
              a.type = winner;
              b.type = winner;
              totalConversions += 2;
              conversionsEl.textContent = totalConversions;
            }
          }
          separate(a,b);
        }
      }
    }

    updateCounts();
    updateGameTime();
    checkForWinner();
  }

  function draw(){
    tctx.fillStyle = 'rgba(244,246,251,0.06)';
    tctx.fillRect(0,0,W,H);

    for (const e of entities){
      const colorBase = TRAIL_COLORS[e.type] || 'rgba(0,0,0,';
      tctx.beginPath();
      tctx.fillStyle = colorBase + '0.25)';
      tctx.arc(e.x, e.y, e.size * 0.20, 0, Math.PI*2);
      tctx.fill();
    }

    ctx.clearRect(0,0,W,H);
    for (const e of entities){
      const img = IMAGES[e.type];
      if (img.complete && img.naturalWidth !== 0){
        ctx.save();
        ctx.translate(e.x, e.y);
        let ang = 0;
        switch(e.dir){
          case 0: ang = -Math.PI/2; break;
          case 1: ang = Math.PI/2; break;
          case 2: ang = Math.PI; break;
          case 3: ang = 0; break;
        }
        ctx.rotate(ang * 0.18);
        ctx.drawImage(img, -e.size/2, -e.size/2, e.size, e.size);
        ctx.restore();
      } else {
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.size/2, 0, Math.PI*2);
        ctx.fillStyle = '#999';
        ctx.fill();
      }
    }
  }

  function loop(){
    if (running){
      tick();
      draw();
    }
    animationFrame = requestAnimationFrame(loop);
  }

  // Blockchain functions
  async function connectWallet() {
    try {
      console.log('Starting wallet connection...');
      
      if (typeof window.ethereum !== 'undefined') {
        console.log('MetaMask detected');
        
        // Check configuration
        if (!CONTRACT_ADDRESS || CONTRACT_ADDRESS === 'YOUR_CONTRACT_ADDRESS') {
          alert('⚠️ Please update CONTRACT_ADDRESS in the HTML file!');
          return;
        }
        if (!CONTRACT_ABI || CONTRACT_ABI.length === 0) {
          alert('⚠️ Please update CONTRACT_ABI in the HTML file!');
          return;
        }
        
        console.log('Contract address:', CONTRACT_ADDRESS);
        console.log('ABI length:', CONTRACT_ABI.length);
        
        web3 = new Web3(window.ethereum);
        console.log('Web3 initialized');
        
        const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
        userAccount = accounts[0];
        console.log('Account connected:', userAccount);
        
        // Check network
        const chainId = await window.ethereum.request({ method: 'eth_chainId' });
        console.log('Connected to chain ID:', chainId);
        
/*         if (chainId !== '0xaa36a7') { // Sepolia chain ID in hex
          alert('⚠️ Please switch to Sepolia network in MetaMask!');
          return;
        } */
        
        console.log('Initializing contract...');
        contract = new web3.eth.Contract(CONTRACT_ABI, CONTRACT_ADDRESS);
        console.log('Contract initialized successfully');
        
        connectBtn.classList.add('hidden');
        walletInfo.classList.remove('hidden');
        bettingForm.classList.remove('hidden');
        walletAddress.textContent = userAccount.substring(0, 6) + '...' + userAccount.substring(38);
        
        console.log('Fetching balance...');
        await updateBalance();
        console.log('Wallet connection complete!');
        
        window.ethereum.on('accountsChanged', (accounts) => {
          userAccount = accounts[0];
          walletAddress.textContent = userAccount.substring(0, 6) + '...' + userAccount.substring(38);
          updateBalance();
        });
      } else {
        alert('Please install MetaMask to use this app!');
      }
    } catch (error) {
      console.error('Error connecting wallet:', error);
      console.error('Error details:', {
        message: error.message,
        code: error.code,
        stack: error.stack
      });
      alert('Failed to connect wallet: ' + error.message);
    }
  }

  async function updateBalance() {
    if (web3 && userAccount) {
      const balance = await web3.eth.getBalance(userAccount);
      const ethBalance = web3.utils.fromWei(balance, 'ether');
      walletBalance.textContent = parseFloat(ethBalance).toFixed(4);
    }
  }

  async function placeBet() {
    try {
      const betAmount = document.getElementById('betAmount').value;
      const prediction = parseInt(document.querySelector('input[name="prediction"]:checked').value);
      currentPrediction = prediction;
      
      if (!betAmount || betAmount <= 0) {
        alert('Please enter a valid bet amount');
        return;
      }

      placeBetBtn.disabled = true;
      placeBetBtn.textContent = 'Processing...';

      const betAmountWei = web3.utils.toWei(betAmount, 'ether');

      const result = await contract.methods.createGame(prediction).send({
        from: userAccount,
        value: betAmountWei
      });

      currentGameId = result.events.GameCreated.returnValues.gameId;
      
      // Notify backend
      await fetch(`${BACKEND_URL}/api/game/started`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          gameId: currentGameId,
          player: userAccount,
          prediction: prediction
        })
      });
      
      bettingForm.classList.add('hidden');
      gameStatus.classList.remove('hidden');
      document.getElementById('currentGameId').textContent = currentGameId;

      gameActive = true;
      pauseBtn.disabled = false;
      resetBtn.disabled = false;
      
      initGame();
      running = true;
      loop();

      await updateBalance();
    } catch (error) {
      console.error('Error placing bet:', error);
      alert('Failed to place bet: ' + error.message);
      placeBetBtn.disabled = false;
      placeBetBtn.textContent = 'Place Bet & Start Game';
    }
  }

  async function resolveGameViaBackend(winnerType) {
    try {
      gameStatus.classList.add('hidden');
      resolving.classList.remove('hidden');

      const response = await fetch(`${BACKEND_URL}/api/game/resolve`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          gameId: currentGameId,
          winner: winnerType
        })
      });

      const data = await response.json();
      
      if (!data.success) {
        throw new Error(data.error);
      }

      resolving.classList.add('hidden');
      gameResult.classList.remove('hidden');
      
      const txLink = document.getElementById('txLink');
      const predictionNames = ['ROCK', 'PAPER', 'SCISSORS'];
      
      if (data.playerWon) {
        gameResult.className = 'mt-3 p-3 rounded-lg bg-green-50 border border-green-200';
        resultText.className = 'font-semibold mb-2 text-green-900';
        resultText.textContent = `🎉 You Won! You predicted ${predictionNames[currentPrediction]} correctly!`;
      } else {
        gameResult.className = 'mt-3 p-3 rounded-lg bg-red-50 border border-red-200';
        resultText.className = 'font-semibold mb-2 text-red-900';
        resultText.textContent = `😢 You Lost! You predicted ${predictionNames[currentPrediction]} but ${winnerType.toUpperCase()} won.`;
      }
      
      txLink.innerHTML = `<span class="text-slate-500">TX:</span> <span class="font-mono text-blue-600">${data.txHash.substring(0, 10)}...</span>`;

      gameActive = false;
      await updateBalance();
    } catch (error) {
      console.error('Error resolving game:', error);
      alert('Failed to resolve game: ' + error.message);
      resolving.classList.add('hidden');
    }
  }

  function startGame() {
    initGame();
    running = true;
    pauseBtn.textContent = 'Pause';
    if (!animationFrame) loop();
  }

  function reset() {
    if (gameActive) {
      alert('Cannot reset during an active bet. Please wait for the game to complete.');
      return;
    }
    running = false;
    initGame();
    pauseBtn.textContent = 'Pause';
    gameTimeEl.textContent = '0:00';
  }

  function togglePause() {
    running = !running;
    pauseBtn.textContent = running ? 'Pause' : 'Resume';
    if (running && !animationFrame) loop();
  }

  function resetForNewGame() {
    gameResult.classList.add('hidden');
    bettingForm.classList.remove('hidden');
    placeBetBtn.disabled = false;
    placeBetBtn.textContent = 'Place Bet & Start Game';
    pauseBtn.disabled = true;
    resetBtn.disabled = true;
    currentGameId = undefined;
    gameActive = false;
    running = false;
    winnerEl.textContent = '';
    gameTimeEl.textContent = '0:00';
    initGame();
  }

  // Event listeners
  connectBtn.addEventListener('click', connectWallet);
  placeBetBtn.addEventListener('click', placeBet);
  playAgainBtn.addEventListener('click', resetForNewGame);
  resetBtn.addEventListener('click', reset);
  pauseBtn.addEventListener('click', togglePause);

  speedSlider.addEventListener('input', () => {
    speedValue.textContent = speedSlider.value;
  });

  movesPerDecisionInput.addEventListener('change', ()=>{
    let v = parseInt(movesPerDecisionInput.value,10);
    if (isNaN(v) || v < 1) v = 1;
    if (v > 20) v = 20;
    movesPerDecisionInput.value = v;
  });

  entityCountInput.addEventListener('change', ()=>{
    let v = parseInt(entityCountInput.value,10);
    if (isNaN(v) || v < 5) v = 5;
    if (v > 50) v = 50;
    entityCountInput.value = v;
  });

  // Initialize
  initGame();
  draw();
  loop();
})();
</script>

</body>
</html>
